<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloPack Eco - CRM Proveedores</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --primary-blue: #1d4ed8;
            --chrome-blue: #023e8a;
            --cyan-accent: #00f5d4;
            --border-color: #e2e8f0;
            --rustic-pattern: rgba(2, 62, 138, 0.05);
            --highlight-bg: #e0f2fe;
        }

        [data-theme="dark"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #edf2f4;
            --primary-blue: #3a86ff;
            --chrome-blue: #0077b6;
            --cyan-accent: #00f5d4;
            --border-color: #334155;
            --rustic-pattern: rgba(0, 245, 212, 0.05);
            --highlight-bg: #1e3a8a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
            /* Patrón geométrico romboidal rústico */
            background-image: 
                linear-gradient(135deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(225deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(45deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(315deg, var(--rustic-pattern) 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-top: 6px solid var(--primary-blue);
            border-bottom: 6px solid var(--cyan-accent);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 2em;
            background: linear-gradient(45deg, var(--chrome-blue), var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: linear-gradient(135deg, var(--chrome-blue), var(--primary-blue));
            color: white;
            border: 1px solid var(--cyan-accent);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.3);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--text-color);
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-color);
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--cyan-accent);
            box-shadow: 0 0 8px var(--cyan-accent);
        }

        .btn-add {
            grid-column: 1 / -1;
            padding: 14px;
            background: linear-gradient(90deg, var(--chrome-blue), var(--primary-blue));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(29, 78, 216, 0.4);
            transition: 0.3s;
        }

        .btn-add:hover {
            filter: brightness(1.2);
            box-shadow: 0 0 15px var(--cyan-accent);
        }

        /* Sección de Comparativa y Recomendación */
        .compare-section {
            background: var(--highlight-bg);
            padding: 15px;
            border-radius: 12px;
            margin: 25px 0;
            border: 1px solid var(--cyan-accent);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9em;
        }

        th {
            background: var(--chrome-blue);
            color: white;
        }

        .badge-best {
            background: var(--cyan-accent);
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8em;
        }

        a.prov-link {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div>
                <h1>CicloPack Eco</h1>
                <small>Módulo de Gestión y Comparación de Proveedores</small>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()">🌓 Cambiar Modo</button>
        </div>

        <!-- FORMULARIO DE INGRESO -->
        <h3>📥 Registrar Nuevo Proveedor</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Proveedor</label>
                <input type="text" id="nombre" placeholder="Ej. Envases Coquimbo">
            </div>
            <div class="form-group">
                <label>Sitio Web</label>
                <input type="url" id="web" placeholder="https://ejemplo.cl">
            </div>
            <div class="form-group">
                <label>Ciudad</label>
                <select id="ciudad">
                    <option value="Coquimbo">Coquimbo</option>
                    <option value="La Serena">La Serena</option>
                    <option value="Santiago">Santiago</option>
                    <option value="Otra">Otra</option>
                </select>
            </div>
            <div class="form-group">
                <label>Producto</label>
                <input type="text" id="producto" placeholder="Ej. Cajas de Cartón 20x20">
            </div>
            <div class="form-group">
                <label>Precio Minorista ($)</label>
                <input type="number" id="pMinorista" placeholder="1500">
            </div>
            <div class="form-group">
                <label>Precio Mayorista ($)</label>
                <input type="number" id="pMayorista" placeholder="1000">
            </div>
            <div class="form-group">
                <label>Tiempo Entrega a Coquimbo (Días)</label>
                <input type="number" id="tiempoEntrega" placeholder="2">
            </div>
            <div class="form-group">
                <label>Ofertas / Promos</label>
                <input type="text" id="ofertas" placeholder="Ej. 10% desc sobre 500 un.">
            </div>
            <button class="btn-add" onclick="guardarProveedor()">Guardar Proveedor</button>
        </div>

        <!-- HERRAMIENTA DE COMPARACIÓN -->
        <div class="compare-section">
            <h3>🔍 Comparador de Productos</h3>
            <div class="form-group">
                <label>Buscar Producto para comparar opciones:</label>
                <input type="text" id="buscarProd" placeholder="Escribe un producto para analizar..." onkeyup="compararProveedores()">
            </div>
            <div id="recomendacion" style="margin-top: 10px; font-size: 0.95em;"></div>
        </div>

        <!-- BASE DE DATOS REGISTRADA -->
        <h3>📋 Base de Datos de Proveedores</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Proveedor</th>
                        <th>Ciudad</th>
                        <th>Producto</th>
                        <th>P. Minorista</th>
                        <th>P. Mayorista</th>
                        <th>Entrega</th>
                        <th>Ofertas</th>
                    </tr>
                </thead>
                <tbody id="tablaCuerpo">
                    <!-- Registros dinámicos -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let proveedores = [];

        function toggleTheme() {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
            } else {
                document.body.setAttribute('data-theme', 'dark');
            }
        }

        function guardarProveedor() {
            const prov = {
                nombre: document.getElementById('nombre').value,
                web: document.getElementById('web').value,
                ciudad: document.getElementById('ciudad').value,
                producto: document.getElementById('producto').value,
                pMinorista: Number(document.getElementById('pMinorista').value),
                pMayorista: Number(document.getElementById('pMayorista').value),
                tiempo: Number(document.getElementById('tiempoEntrega').value),
                ofertas: document.getElementById('ofertas').value || 'Sin promo'
            };

            if (!prov.nombre || !prov.producto || !prov.pMayorista) {
                alert("Por favor completa al menos Nombre, Producto y Precio Mayorista.");
                return;
            }

            proveedores.push(prov);
            actualizarTabla();
            limpiarFormulario();
        }

        function actualizarTabla() {
            const tbody = document.getElementById('tablaCuerpo');
            tbody.innerHTML = '';

            proveedores.forEach(p => {
                const webLink = p.web ? `<a href="${p.web}" target="_blank" class="prov-link">${p.nombre} 🔗</a>` : p.nombre;
                const fila = `
                    <tr>
                        <td><strong>${webLink}</strong></td>
                        <td>${p.ciudad}</td>
                        <td>${p.producto}</td>
                        <td>$${p.pMinorista.toLocaleString('es-CL')}</td>
                        <td><strong>$${p.pMayorista.toLocaleString('es-CL')}</strong></td>
                        <td>${p.tiempo} días</td>
                        <td><small>${p.ofertas}</small></td>
                    </tr>
                `;
                tbody.innerHTML += fila;
            });
        }

        function limpiarFormulario() {
            document.getElementById('nombre').value = '';
            document.getElementById('web').value = '';
            document.getElementById('producto').value = '';
            document.getElementById('pMinorista').value = '';
            document.getElementById('pMayorista').value = '';
            document.getElementById('tiempoEntrega').value = '';
            document.getElementById('ofertas').value = '';
        }

        function compararProveedores() {
            const busqueda = document.getElementById('buscarProd').value.toLowerCase().trim();
            const divRec = document.getElementById('recomendacion');

            if (!busqueda) {
                divRec.innerHTML = '';
                return;
            }

            const coincidentes = proveedores.filter(p => p.producto.toLowerCase().includes(busqueda));

            if (coincidentes.length === 0) {
                divRec.innerHTML = '<em>No hay proveedores registrados con ese producto.</em>';
                return;
            }

            // Algoritmo simple para seleccionar el mejor (menor precio mayorista)
            let mejor = coincidentes.reduce((prev, curr) => (prev.pMayorista < curr.pMayorista) ? prev : curr);

            divRec.innerHTML = `
                💡 <strong>Mejor Opción Encontrada:</strong> Comprar a <strong>${mejor.nombre}</strong> 
                a <strong>$${mejor.pMayorista.toLocaleString('es-CL')}</strong> (Mayorista) 
                con entrega en <strong>${mejor.tiempo} días</strong> a Coquimbo. <span class="badge-best">RECOMENDADO</span>
            `;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloPack Eco - CRM Proveedores</title>
    <style>
        :root {
            /* MODO CLARO */
            --bg-body: #e2e8f0;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-blue: #1d4ed8;
            --chrome-blue: #023e8a;
            --cyan-accent: #00f5d4;
            --border-color: #cbd5e1;
            --rustic-pattern: rgba(2, 62, 138, 0.08);
            --highlight-bg: #f0f9ff;
            --modal-bg: rgba(0,0,0,0.5);
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        [data-theme="dark"] {
            /* MODO OSCURO */
            --bg-body: #020617;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary-blue: #3b82f6;
            --chrome-blue: #0ea5e9;
            --cyan-accent: #00f5d4;
            --border-color: #334155;
            --rustic-pattern: rgba(0, 245, 212, 0.08);
            --highlight-bg: #172554;
            --modal-bg: rgba(0,0,0,0.7);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            padding: 3vh 4vw;
            transition: all 0.3s ease;
            
            background-image: 
                linear-gradient(135deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(225deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(45deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(315deg, var(--rustic-pattern) 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0;
            background-size: 20px 20px;
            background-repeat: repeat;
        }

        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            background-color: var(--bg-main);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            min-height: 90vh;
        }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 15px; margin-bottom: 25px;
        }

        h1 {
            margin: 0; font-size: 2.2em;
            background: linear-gradient(45deg, var(--chrome-blue), var(--cyan-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle, .btn-primary {
            background: linear-gradient(135deg, var(--chrome-blue), var(--primary-blue));
            color: white; border: 1px solid var(--cyan-accent);
            padding: 10px 20px; border-radius: 8px;
            cursor: pointer; font-weight: bold; font-size: 1em;
            box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); transition: 0.3s;
        }
        .theme-toggle:hover, .btn-primary:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--cyan-accent); }

        .btn-secondary {
            background: #64748b; color: white; border: none;
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold; transition: 0.3s;}
        .btn-danger:hover { filter: brightness(0.9); }
        
        .btn-warning { background: var(--warning); color: #000; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold; transition: 0.3s;}
        .btn-warning:hover { filter: brightness(0.9); }

        /* MODALES */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-bg); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 800px;
            border-radius: 12px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            max-height: 90vh; overflow-y: auto; border-top: 5px solid var(--primary-blue);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .modal-header h2 { margin: 0; color: var(--text-color); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 15px; margin-bottom: 15px;}
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: bold; margin-bottom: 5px; color: var(--text-color); }
        
        /* EFECTO GLOW PARA TODOS LOS INPUTS Y SELECTS */
        input, select { 
            padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
            background: var(--bg-main); color: var(--text-color); outline: none; transition: 0.3s;
        }
        input:focus, select:focus { 
            border-color: var(--cyan-accent); 
            box-shadow: 0 0 12px var(--cyan-accent); 
        }

        /* BOTONES DE SELECCIÓN (RADIO) */
        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;}
        .radio-label {
            padding: 8px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold;
            cursor: pointer; border: 2px solid var(--border-color);
            display: flex; align-items: center; gap: 5px; color: var(--text-color);
            background: transparent; transition: 0.3s;
        }
        .radio-label input { display: none; }
        
        .radio-label:has(input:checked) { color: white; transform: scale(1.05); }
        .opt-eco:has(input:checked) { background-color: #0ea5e9; border-color: #0ea5e9; box-shadow: 0 0 12px #0ea5e9; }
        .opt-premium:has(input:checked) { background-color: #a855f7; border-color: #a855f7; box-shadow: 0 0 12px #a855f7; }
        .opt-oficial:has(input:checked) { background-color: #10b981; border-color: #10b981; box-shadow: 0 0 12px #10b981; }
        .opt-posible:has(input:checked) { background-color: #eab308; border-color: #eab308; box-shadow: 0 0 12px #eab308; }

        .fav-btn { font-size: 2em; cursor: pointer; color: #cbd5e1; user-select: none; transition: 0.3s; }
        .fav-active { color: #fbbf24; filter: drop-shadow(0 0 8px #fbbf24); }

        /* TABLAS Y FILTROS */
        .filtros-bar {
            display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;
            background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color);
        }
        .filtros-bar select { padding: 8px; font-size: 0.85em; flex: 1; min-width: 120px;}
        
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden;}
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); font-size: 0.9em;}
        th { background: var(--chrome-blue); color: white; }
        tr:hover { background: var(--highlight-bg); }

        /* ETIQUETAS */
        .tag { padding: 3px 8px; border-radius: 4px; font-size: 0.75em; font-weight: bold; color: white;}
        .tag-eco { background-color: #0ea5e9; }
        .tag-premium { background-color: #a855f7; }
        .tag-hibrido { background: linear-gradient(90deg, #0ea5e9, #a855f7); box-shadow: 0 0 8px rgba(168, 85, 247, 0.4); }
        .tag-oficial { background-color: #10b981; }
        .tag-posible { background-color: #eab308; }

        /* ACORDEONES DIRECTORIO GENERAL */
        details { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        summary { 
            background: var(--bg-main); padding: 15px; font-weight: bold; cursor: pointer; list-style: none; 
            display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid transparent; transition: 0.3s; color: var(--text-color);
        }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: var(--highlight-bg); }
        details[open] > summary { border-bottom-color: var(--border-color); background: var(--highlight-bg); }
        .details-content { padding: 15px; background: var(--card-bg); }
        
        /* Niveles de anidación */
        .cat-details { margin-left: 20px; border-left: 3px solid var(--chrome-blue); margin-top: 10px; }
        .subcat-details { margin-left: 20px; border-left: 3px solid var(--cyan-accent); margin-top: 10px; }

        .prod-item-dir { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; background: var(--highlight-bg); border-radius: 6px; 
            margin-bottom: 5px; border: 1px solid var(--border-color); flex-wrap: wrap; gap: 10px;
        }

    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div>
                <h1>CicloPack Eco</h1>
                <small>Sistema CRM - Gestión de Proveedores</small>
            </div>
            <div>
                <button class="btn-primary" onclick="abrirModalProv()">+ Nuevo Proveedor</button>
                <button class="theme-toggle" onclick="toggleTheme()">🌓 Modo</button>
            </div>
        </div>

        <div style="background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--cyan-accent); margin-bottom: 25px;">
            <h3 style="margin-top:0;">🔍 Analizador de Precios</h3>
            <div class="form-group">
                <input type="text" id="buscarProd" placeholder="Escribe un producto (ej. Cajas) para buscar la mejor opción..." onkeyup="compararProveedores()">
            </div>
            <div id="recomendacion" style="margin-top: 10px; font-size: 0.95em;"></div>
        </div>

        <h3>📋 Directorio General</h3>
        
        <!-- BARRA DE FILTROS -->
        <div class="filtros-bar">
            <select id="filtroFav" onchange="actualizarDirectorio()">
                <option value="todos">⭐ Todos (Fav y No Fav)</option>
                <option value="fav">Solo Favoritos</option>
            </select>
            <select id="filtroCat" onchange="actualizarDirectorio()">
                <option value="todos">🎨 Todas las Líneas</option>
                <option value="Eco">Tradicional / Eco</option>
                <option value="Premium">Sustentable / Premium</option>
                <option value="Híbrido">Híbrido (Bicolor)</option>
            </select>
            <select id="filtroEst" onchange="actualizarDirectorio()">
                <option value="todos">🟢 Todos los Estados</option>
                <option value="Oficial">Actual / Oficial</option>
                <option value="Posible">Posible Proveedor</option>
            </select>
            <select id="filtroCiu" onchange="actualizarDirectorio()">
                <option value="todos">📍 Todas las Ciudades</option>
                <option value="Coquimbo">Coquimbo</option>
                <option value="La Serena">La Serena</option>
                <option value="Santiago">Santiago</option>
                <option value="Otra">Otra</option>
            </select>
        </div>

        <!-- CONTENEDOR DE ACORDEONES -->
        <div id="contenedorDirectorio">
            <!-- Proveedores dinámicos -->
        </div>
    </div>

    <!-- MODAL 1: NUEVO PROVEEDOR -->
    <div class="modal-overlay" id="modalProv">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏢 Ficha de Nuevo Proveedor</h2>
                <div class="fav-btn" id="estrellaFav" onclick="toggleFav()">☆</div>
            </div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre del Proveedor</label>
                    <input type="text" id="provNombre" placeholder="Ej. Back2Bio">
                </div>
                <div class="form-group">
                    <label>Sitio Web</label>
                    <input type="url" id="provWeb" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Número de Contacto</label>
                    <input type="tel" id="provContacto" placeholder="Ej. +56 9 1234 5678">
                </div>
                <div class="form-group">
                    <label>Ciudad</label>
                    <select id="provCiudad">
                        <option value="Coquimbo">Coquimbo</option>
                        <option value="La Serena">La Serena</option>
                        <option value="Santiago">Santiago</option>
                        <option value="Otra">Otra</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tiempo Entrega a Coquimbo (Días)</label>
                    <input type="number" id="provTiempo" placeholder="Ej. 2">
                </div>
            </div>

            <!-- LÍNEA AUTOMÁTICA -->
            <div style="background: var(--highlight-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed var(--border-color); display: flex; align-items: center; gap: 10px;">
                <label style="margin:0;">Clasificación de Línea (Automática):</label> 
                <span id="etiquetaLineaProv" class="tag" style="background:#64748b;">Sin Productos</span>
            </div>

            <label>Estado de Proveedor:</label>
            <div class="radio-group">
                <label class="radio-label opt-oficial"><input type="radio" name="catEstado" value="Oficial" checked> Actual / Oficial</label>
                <label class="radio-label opt-posible"><input type="radio" name="catEstado" value="Posible"> Posible Proveedor</label>
            </div>

            <hr style="border-color: var(--border-color); margin: 20px 0;">
            
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">📦 Lista de Productos</h3>
                <button class="btn-primary" style="padding: 5px 15px; font-size: 0.9em;" onclick="abrirModalProd('temp')">+ Agregar Producto</button>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Línea</th>
                            <th>Categoría</th>
                            <th>Producto</th>
                            <th>Minorista</th>
                            <th>Mayorista</th>
                            <th>Oferta</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="listaTempProductos"></tbody>
                </table>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 25px; justify-content: flex-end;">
                <button class="btn-secondary" onclick="cerrarModalProv()">Cancelar</button>
                <button class="btn-primary" onclick="guardarProveedorFinal()">Guardar Proveedor</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: AGREGAR / EDITAR PRODUCTO -->
    <div class="modal-overlay" id="modalProd">
        <div class="modal-content" style="max-width: 550px; border-top-color: var(--cyan-accent);">
            <div class="modal-header">
                <h2 id="tituloModalProd">➕ Detalle del Producto</h2>
            </div>
            
            <label>Línea del Producto:</label>
            <div class="radio-group">
                <label class="radio-label opt-eco"><input type="radio" name="prodLinea" value="Eco" checked> Tradicional / Eco</label>
                <label class="radio-label opt-premium"><input type="radio" name="prodLinea" value="Premium"> Sustentable / Premium</label>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="prodCatSelect" onchange="verificarCategoria('Cat')"></select>
                    <input type="text" id="prodCatNueva" placeholder="Escribe nueva categoría..." style="display:none; margin-top:5px; border-color: var(--warning);">
                </div>
                <div class="form-group">
                    <label>Sub-Categoría</label>
                    <select id="prodSubSelect" onchange="verificarCategoria('Sub')"></select>
                    <input type="text" id="prodSubNueva" placeholder="Escribe nueva sub-categoría..." style="display:none; margin-top:5px; border-color: var(--warning);">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>Nombre del Producto</label>
                <input type="text" id="prodNombre" placeholder="Ej. Envase PET 500cc">
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Precio Minorista ($)</label>
                    <input type="number" id="prodMin" placeholder="1500">
                </div>
                <div class="form-group">
                    <label>Precio Mayorista ($)</label>
                    <input type="number" id="prodMay" placeholder="1000">
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label>Oferta Especial</label>
                <input type="text" id="prodOferta" placeholder="Ej. 10% dcto sobre 50 un.">
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-secondary" onclick="cerrarModalProd()">Cancelar</button>
                <button class="btn-primary" onclick="procesarGuardadoProducto()">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS Y ESTADOS ---
        let directorio = []; 
        let productosTemporales = [];
        let esFavActual = false;
        
        let categoriasBase = ["Plástico", "Cartón", "Aluminio", "Papelería", "Biodegradable"];
        let subcategoriasBase = ["Bolsas camiseta", "Bolsas transparentes/celofán", "Bolsas taco/prepicadas", "Vasos", "Cajas"];

        let contextoProducto = { modo: 'temp', idProv: null, idProd: null }; // Controla si creamos o editamos

        // --- PERSISTENCIA DE DATOS (LOCALSTORAGE) ---
        function cargarDatos() {
            const dataDir = localStorage.getItem('cicloPack_directorio');
            const dataCat = localStorage.getItem('cicloPack_categorias');
            const dataSub = localStorage.getItem('cicloPack_subcategorias');
            const theme = localStorage.getItem('cicloPack_theme');

            if(dataDir) directorio = JSON.parse(dataDir);
            if(dataCat) categoriasBase = JSON.parse(dataCat);
            if(dataSub) subcategoriasBase = JSON.parse(dataSub);
            if(theme === 'dark') document.body.setAttribute('data-theme', 'dark');

            actualizarDirectorio();
        }

        function guardarDatos() {
            localStorage.setItem('cicloPack_directorio', JSON.stringify(directorio));
            localStorage.setItem('cicloPack_categorias', JSON.stringify(categoriasBase));
            localStorage.setItem('cicloPack_subcategorias', JSON.stringify(subcategoriasBase));
        }

        // --- UTILIDADES ---
        function toggleTheme() {
            const body = document.body;
            if(body.getAttribute('data-theme') === 'dark') {
                body.removeAttribute('data-theme');
                localStorage.setItem('cicloPack_theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                localStorage.setItem('cicloPack_theme', 'dark');
            }
        }

        function toggleFav() {
            esFavActual = !esFavActual;
            const estrella = document.getElementById('estrellaFav');
            estrella.innerHTML = esFavActual ? '★' : '☆';
            if(esFavActual) estrella.classList.add('fav-active');
            else estrella.classList.remove('fav-active');
        }

        function generarId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }

        function determinarLineaProveedor(productos) {
            if(!productos || productos.length === 0) return "Sin Productos";
            const tieneEco = productos.some(p => p.linea === 'Eco');
            const tienePremium = productos.some(p => p.linea === 'Premium');
            if(tieneEco && tienePremium) return "Híbrido";
            if(tieneEco) return "Eco";
            return "Premium";
        }

        function getClaseTag(linea) {
            if(linea === 'Eco') return 'tag-eco';
            if(linea === 'Premium') return 'tag-premium';
            if(linea === 'Híbrido') return 'tag-hibrido';
            return '';
        }

        // --- MODAL PROVEEDOR ---
        function abrirModalProv() {
            productosTemporales = []; 
            esFavActual = false;
            document.getElementById('estrellaFav').innerHTML = '☆';
            document.getElementById('estrellaFav').classList.remove('fav-active');
            
            document.getElementById('provNombre').value = '';
            document.getElementById('provWeb').value = '';
            document.getElementById('provContacto').value = '';
            document.getElementById('provTiempo').value = '';
            
            actualizarLineaTemp();
            actualizarTablaTemp();
            document.getElementById('modalProv').style.display = 'flex';
        }
        function cerrarModalProv() { document.getElementById('modalProv').style.display = 'none'; }

        function actualizarLineaTemp() {
            const linea = determinarLineaProveedor(productosTemporales);
            const etiqueta = document.getElementById('etiquetaLineaProv');
            etiqueta.innerText = linea;
            etiqueta.className = 'tag ' + getClaseTag(linea);
            if(linea === 'Sin Productos') etiqueta.style.background = '#64748b';
        }

        function actualizarTablaTemp() {
            const tbody = document.getElementById('listaTempProductos');
            tbody.innerHTML = '';
            productosTemporales.forEach(p => {
                tbody.innerHTML += `<tr>
                    <td><span class="tag ${getClaseTag(p.linea)}">${p.linea}</span></td>
                    <td><small>${p.categoria} > ${p.subcategoria}</small></td>
                    <td>${p.nombre}</td>
                    <td>$${p.minorista.toLocaleString('es-CL')}</td>
                    <td><strong>$${p.mayorista.toLocaleString('es-CL')}</strong></td>
                    <td><small>${p.oferta}</small></td>
                    <td><button class="btn-danger" onclick="eliminarProdTemp('${p.id}')">X</button></td>
                </tr>`;
            });
        }

        function eliminarProdTemp(id) {
            productosTemporales = productosTemporales.filter(p => p.id !== id);
            actualizarLineaTemp();
            actualizarTablaTemp();
        }

        function guardarProveedorFinal() {
            const nombre = document.getElementById('provNombre').value;
            if(!nombre || productosTemporales.length === 0) {
                alert("Ingresa el nombre del proveedor y al menos un producto."); return;
            }

            const proveedor = {
                id: 'prov_' + generarId(),
                nombre: nombre,
                web: document.getElementById('provWeb').value,
                contacto: document.getElementById('provContacto').value || '-',
                ciudad: document.getElementById('provCiudad').value,
                tiempo: document.getElementById('provTiempo').value || '-',
                linea: determinarLineaProveedor(productosTemporales),
                estado: document.querySelector('input[name="catEstado"]:checked').value,
                favorito: esFavActual,
                productos: [...productosTemporales]
            };

            directorio.push(proveedor);
            guardarDatos();
            actualizarDirectorio();
            cerrarModalProv();
        }

        function eliminarProveedor(idProv) {
            if(confirm("¿Eliminar este proveedor y todos sus productos definitivamente?")) {
                directorio = directorio.filter(p => p.id !== idProv);
                guardarDatos();
                actualizarDirectorio();
            }
        }

        // --- MODAL PRODUCTO ---
        function cargarSelectsCategoria() {
            const sCat = document.getElementById('prodCatSelect');
            const sSub = document.getElementById('prodSubSelect');
            
            sCat.innerHTML = categoriasBase.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="OTRA">➕ Crear Nueva...</option>`;
            sSub.innerHTML = subcategoriasBase.map(s => `<option value="${s}">${s}</option>`).join('') + `<option value="OTRA">➕ Crear Nueva...</option>`;
            
            document.getElementById('prodCatNueva').style.display = 'none';
            document.getElementById('prodSubNueva').style.display = 'none';
        }

        function verificarCategoria(tipo) {
            const select = document.getElementById('prod' + tipo + 'Select');
            const input = document.getElementById('prod' + tipo + 'Nueva');
            input.style.display = select.value === 'OTRA' ? 'block' : 'none';
            if(select.value === 'OTRA') input.focus();
        }

        function abrirModalProd(modo, idProv = null, idProd = null) {
            contextoProducto = { modo, idProv, idProd };
            cargarSelectsCategoria();
            
            document.getElementById('tituloModalProd').innerText = modo === 'edit' ? '✏️ Editar Producto' : '➕ Detalle del Producto';
            
            // Limpiar
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodMin').value = '';
            document.getElementById('prodMay').value = '';
            document.getElementById('prodOferta').value = '';
            document.querySelector('input[name="prodLinea"][value="Eco"]').checked = true;

            // Si es edición, poblar datos
            if(modo === 'edit') {
                const prov = directorio.find(p => p.id === idProv);
                const prod = prov.productos.find(p => p.id === idProd);
                
                document.getElementById('prodNombre').value = prod.nombre;
                document.getElementById('prodMin').value = prod.minorista;
                document.getElementById('prodMay').value = prod.mayorista;
                document.getElementById('prodOferta').value = prod.oferta;
                document.querySelector(`input[name="prodLinea"][value="${prod.linea}"]`).checked = true;
                
                if(categoriasBase.includes(prod.categoria)) document.getElementById('prodCatSelect').value = prod.categoria;
                if(subcategoriasBase.includes(prod.subcategoria)) document.getElementById('prodSubSelect').value = prod.subcategoria;
            }
            
            document.getElementById('modalProd').style.display = 'flex';
        }
        function cerrarModalProd() { document.getElementById('modalProd').style.display = 'none'; }

        function procesarGuardadoProducto() {
            let cat = document.getElementById('prodCatSelect').value;
            let sub = document.getElementById('prodSubSelect').value;
            
            if(cat === 'OTRA') {
                cat = document.getElementById('prodCatNueva').value.trim();
                if(cat && !categoriasBase.includes(cat)) categoriasBase.push(cat);
            }
            if(sub === 'OTRA') {
                sub = document.getElementById('prodSubNueva').value.trim();
                if(sub && !subcategoriasBase.includes(sub)) subcategoriasBase.push(sub);
            }

            const prod = {
                nombre: document.getElementById('prodNombre').value,
                linea: document.querySelector('input[name="prodLinea"]:checked').value,
                categoria: cat || 'Sin Categoría',
                subcategoria: sub || 'Sin Subcategoría',
                minorista: Number(document.getElementById('prodMin').value),
                mayorista: Number(document.getElementById('prodMay').value),
                oferta: document.getElementById('prodOferta').value || '-'
            };

            if(!prod.nombre || !prod.mayorista) { alert("Ingresa nombre y precio mayorista."); return; }

            if(contextoProducto.modo === 'temp') {
                prod.id = 'temp_' + generarId();
                productosTemporales.push(prod);
                actualizarLineaTemp();
                actualizarTablaTemp();
            } else if (contextoProducto.modo === 'add_dir') {
                prod.id = 'prod_' + generarId();
                const prov = directorio.find(p => p.id === contextoProducto.idProv);
                prov.productos.push(prod);
                prov.linea = determinarLineaProveedor(prov.productos);
                guardarDatos();
                actualizarDirectorio();
            } else if (contextoProducto.modo === 'edit') {
                const prov = directorio.find(p => p.id === contextoProducto.idProv);
                const indice = prov.productos.findIndex(p => p.id === contextoProducto.idProd);
                prod.id = contextoProducto.idProd; // Mantener ID
                prov.productos[indice] = prod;
                prov.linea = determinarLineaProveedor(prov.productos);
                guardarDatos();
                actualizarDirectorio();
            }

            cerrarModalProd();
        }

        function eliminarProductoDir(idProv, idProd) {
            if(confirm("¿Eliminar este producto?")) {
                const prov = directorio.find(p => p.id === idProv);
                prov.productos = prov.productos.filter(p => p.id !== idProd);
                prov.linea = determinarLineaProveedor(prov.productos);
                guardarDatos();
                actualizarDirectorio();
            }
        }

        // --- RENDERIZADO DIRECTORIO (ACORDEONES) ---
        function actualizarDirectorio() {
            const fFav = document.getElementById('filtroFav').value;
            const fCat = document.getElementById('filtroCat').value;
            const fEst = document.getElementById('filtroEst').value;
            const fCiu = document.getElementById('filtroCiu').value;

            let directorioFiltrado = directorio.filter(prov => {
                let pasaFav = (fFav === 'todos') || (fFav === 'fav' && prov.favorito);
                let pasaCat = (fCat === 'todos') || (prov.linea === fCat);
                let pasaEst = (fEst === 'todos') || (prov.estado === fEst);
                let pasaCiu = (fCiu === 'todos') || (prov.ciudad === fCiu);
                return pasaFav && pasaCat && pasaEst && pasaCiu;
            });

            directorioFiltrado.sort((a, b) => {
                let scoreA = (a.favorito ? 2 : 0) + (a.estado === 'Oficial' ? 1 : 0);
                let scoreB = (b.favorito ? 2 : 0) + (b.estado === 'Oficial' ? 1 : 0);
                return scoreB - scoreA; 
            });

            const contenedor = document.getElementById('contenedorDirectorio');
            contenedor.innerHTML = '';

            if(directorioFiltrado.length === 0) {
                contenedor.innerHTML = '<p>No hay datos que coincidan con tu búsqueda.</p>';
                compararProveedores();
                return;
            }

            directorioFiltrado.forEach(prov => {
                const favIcon = prov.favorito ? '<span style="color:gold; font-size:1.2em; filter:drop-shadow(0 0 5px gold);">★</span>' : '<span style="color:gray;">☆</span>';
                const tagLinea = `<span class="tag ${getClaseTag(prov.linea)}">${prov.linea}</span>`;
                const tagEstado = prov.estado === 'Oficial' ? '<span class="tag tag-oficial">Oficial</span>' : '<span class="tag tag-posible">Posible</span>';
                const webLink = prov.web ? `<a href="${prov.web}" target="_blank" style="color:var(--primary-blue); font-weight:bold; margin-left:10px;">🔗 Web</a>` : ``;

                // Construir el contenedor del proveedor
                let htmlProv = `
                <details>
                    <summary>
                        <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
                            ${favIcon} <strong style="font-size:1.1em;">${prov.nombre}</strong>
                            ${tagLinea} ${tagEstado}
                            <span style="font-size:0.85em; opacity:0.8;">📍 ${prov.ciudad} | 📞 ${prov.contacto} | 🚚 ${prov.tiempo}d.</span>
                            ${webLink}
                        </div>
                        <div style="display:flex; gap:10px; margin-top:5px;">
                            <button class="btn-primary" style="padding:4px 10px; font-size:0.8em;" onclick="abrirModalProd('add_dir', '${prov.id}')">+ Añadir Prod.</button>
                            <button class="btn-danger" onclick="eliminarProveedor('${prov.id}')">Eliminar Prov.</button>
                        </div>
                    </summary>
                    <div class="details-content">
                `;

                // Agrupar productos
                let agrupado = {};
                prov.productos.forEach(prod => {
                    if(!agrupado[prod.categoria]) agrupado[prod.categoria] = {};
                    if(!agrupado[prod.categoria][prod.subcategoria]) agrupado[prod.categoria][prod.subcategoria] = [];
                    agrupado[prod.categoria][prod.subcategoria].push(prod);
                });

                if(Object.keys(agrupado).length === 0) {
                    htmlProv += `<em>Este proveedor no tiene productos registrados.</em>`;
                }

                // Renderizar anidamiento
                for(let cat in agrupado) {
                    htmlProv += `<details class="cat-details"><summary>📂 ${cat}</summary><div class="details-content">`;
                    for(let sub in agrupado[cat]) {
                        htmlProv += `<details class="subcat-details" open><summary>📁 ${sub}</summary><div class="details-content">`;
                        
                        agrupado[cat][sub].forEach(prod => {
                            htmlProv += `
                            <div class="prod-item-dir">
                                <div style="display:flex; align-items:center; gap:10px;">
                                    <span class="tag ${getClaseTag(prod.linea)}">${prod.linea}</span>
                                    <strong>${prod.nombre}</strong>
                                    <small style="opacity:0.7;">(Oferta: ${prod.oferta})</small>
                                </div>
                                <div style="display:flex; align-items:center; gap:15px; flex-wrap:wrap;">
                                    <span style="font-size:0.9em;">Min: $${prod.minorista.toLocaleString('es-CL')}</span>
                                    <span style="color:#10b981; font-weight:bold; font-size:1.1em;">May: $${prod.mayorista.toLocaleString('es-CL')}</span>
                                    <button class="btn-warning" onclick="abrirModalProd('edit', '${prov.id}', '${prod.id}')">Editar</button>
                                    <button class="btn-danger" onclick="eliminarProductoDir('${prov.id}', '${prod.id}')">X</button>
                                </div>
                            </div>`;
                        });
                        htmlProv += `</div></details>`;
                    }
                    htmlProv += `</div></details>`;
                }

                htmlProv += `</div></details>`;
                contenedor.innerHTML += htmlProv;
            });
            
            compararProveedores();
        }

        function compararProveedores() {
            const busqueda = document.getElementById('buscarProd').value.toLowerCase().trim();
            const divRec = document.getElementById('recomendacion');

            if (!busqueda || directorio.length === 0) {
                divRec.innerHTML = ''; return;
            }

            let opciones = [];
            directorio.forEach(prov => {
                prov.productos.forEach(prod => {
                    if(prod.nombre.toLowerCase().includes(busqueda) || prod.categoria.toLowerCase().includes(busqueda) || prod.subcategoria.toLowerCase().includes(busqueda)) {
                        opciones.push({
                            provNombre: prov.nombre, prodNombre: prod.nombre,
                            precio: prod.mayorista, tiempo: prov.tiempo,
                            esOficial: prov.estado === 'Oficial', esFav: prov.favorito
                        });
                    }
                });
            });

            if (opciones.length === 0) {
                divRec.innerHTML = '<em>No hay coincidencias en tu base de datos.</em>'; return;
            }

            let mejor = opciones.reduce((prev, curr) => (prev.precio < curr.precio) ? prev : curr);

            divRec.innerHTML = `
                💡 <strong>Mejor Opción:</strong> 
                <strong>${mejor.provNombre}</strong> tiene "${mejor.prodNombre}" a 
                <strong style="color:#10b981;">$${mejor.precio.toLocaleString('es-CL')} (Mayorista)</strong>. 
                Tiempo estimado: ${mejor.tiempo} días. 
                ${mejor.esFav ? '⭐(Tu Favorito)' : ''} 
                ${mejor.esOficial ? '<span class="tag tag-oficial">Prov. Oficial</span>' : ''}
            `;
        }

        // --- INICIALIZAR AL CARGAR ---
        window.onload = cargarDatos;
    </script>
</body>
</html>

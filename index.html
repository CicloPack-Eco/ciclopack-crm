<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CicloPack Eco - CRM Proveedores</title>
    <style>
        :root {
            /* MODO CLARO */
            --bg-body: #e2e8f0;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --primary-blue: #1d4ed8;
            --chrome-blue: #023e8a;
            --cyan-accent: #00f5d4;
            --border-color: #cbd5e1;
            --rustic-pattern: rgba(2, 62, 138, 0.08);
            --highlight-bg: #f0f9ff;
            --modal-bg: rgba(0,0,0,0.5);
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        [data-theme="dark"] {
            /* MODO OSCURO */
            --bg-body: #020617;
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary-blue: #3b82f6;
            --chrome-blue: #0ea5e9;
            --cyan-accent: #00f5d4;
            --border-color: #334155;
            --rustic-pattern: rgba(0, 245, 212, 0.08);
            --highlight-bg: #172554;
            --modal-bg: rgba(0,0,0,0.7);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0; padding: 3vh 4vw; transition: all 0.3s ease;
            background-image: 
                linear-gradient(135deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(225deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(45deg, var(--rustic-pattern) 25%, transparent 25%), 
                linear-gradient(315deg, var(--rustic-pattern) 25%, transparent 25%);
            background-position: 10px 0, 10px 0, 0 0, 0 0; background-size: 20px 20px; background-repeat: repeat;
        }

        .main-container {
            max-width: 1300px; margin: 0 auto; background-color: var(--bg-main);
            padding: 30px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            border: 1px solid var(--border-color); min-height: 90vh;
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 25px; }
        h1 { margin: 0; font-size: 2.2em; background: linear-gradient(45deg, var(--chrome-blue), var(--cyan-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .btn-primary { background: linear-gradient(135deg, var(--chrome-blue), var(--primary-blue)); color: white; border: 1px solid var(--cyan-accent); padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 0 10px rgba(0, 245, 212, 0.2); transition: 0.3s; }
        .btn-primary:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--cyan-accent); }
        .btn-secondary { background: #64748b; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-danger { background: var(--danger); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold;}
        .btn-warning { background: var(--warning); color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8em; font-weight: bold; color: #000;}

        /* MODALES */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 750px; border-radius: 12px; padding: 25px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 90vh; overflow-y: auto; border-top: 5px solid var(--primary-blue); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;}
        .modal-header h2 { margin: 0; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 15px; margin-bottom: 15px;}
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85em; font-weight: bold; margin-bottom: 5px; }
        input, select { padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-color); outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--cyan-accent); box-shadow: 0 0 12px var(--cyan-accent); }

        .radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;}
        .radio-label { padding: 8px 12px; border-radius: 20px; font-size: 0.85em; font-weight: bold; cursor: pointer; border: 2px solid var(--border-color); display: flex; align-items: center; gap: 5px; background: transparent; transition: 0.3s; }
        .radio-label input { display: none; }
        .radio-label:has(input:checked) { color: white; transform: scale(1.05); }
        .opt-eco:has(input:checked) { background-color: #0ea5e9; border-color: #0ea5e9; box-shadow: 0 0 12px #0ea5e9; }
        .opt-premium:has(input:checked) { background-color: #a855f7; border-color: #a855f7; box-shadow: 0 0 12px #a855f7; }
        .opt-oficial:has(input:checked) { background-color: #10b981; border-color: #10b981; box-shadow: 0 0 12px #10b981; }
        .opt-posible:has(input:checked) { background-color: #eab308; border-color: #eab308; box-shadow: 0 0 12px #eab308; }

        .tag { padding: 4px 10px; border-radius: 6px; font-size: 0.8em; font-weight: bold; color: white; display: inline-block;}
        .tag-eco { background-color: #0ea5e9; }
        .tag-premium { background-color: #a855f7; }
        .tag-hibrido { background: linear-gradient(90deg, #0ea5e9, #a855f7); box-shadow: 0 0 8px rgba(168, 85, 247, 0.4); }
        .tag-oficial { background-color: #10b981; }
        .tag-posible { background-color: #eab308; }

        /* ACORDEONES (DETAILS/SUMMARY) */
        details { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        summary { background: var(--bg-main); padding: 15px; font-weight: bold; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid transparent; transition: 0.3s; }
        summary::-webkit-details-marker { display: none; }
        summary:hover { background: var(--highlight-bg); }
        details[open] summary { border-bottom-color: var(--border-color); }
        .details-content { padding: 15px; }
        
        .cat-details { margin-left: 20px; border-left: 3px solid var(--chrome-blue); }
        .subcat-details { margin-left: 20px; border-left: 3px solid var(--cyan-accent); }

        .prod-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: var(--highlight-bg); border-radius: 6px; margin-bottom: 5px; border: 1px solid var(--border-color); }
        
        .filtros-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .filtros-bar select { padding: 8px; font-size: 0.85em; flex: 1; min-width: 120px;}
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header">
            <div>
                <h1>CicloPack Eco</h1>
                <small>Sistema CRM - Gestión de Proveedores</small>
            </div>
            <div>
                <button class="btn-primary" onclick="abrirModalProv()">+ Nuevo Proveedor</button>
                <button class="btn-primary" onclick="toggleTheme()" style="background: #334155; border-color: #94a3b8;">🌓 Modo</button>
            </div>
        </div>

        <div class="filtros-bar">
            <select id="filtroLinea" onchange="renderDirectorio()">
                <option value="todos">🎨 Todas las Líneas (Prov.)</option>
                <option value="Eco">Solo Eco</option>
                <option value="Premium">Solo Premium</option>
                <option value="Híbrido">Solo Híbrido (Bicolor)</option>
            </select>
            <select id="filtroEst" onchange="renderDirectorio()">
                <option value="todos">🟢 Todos los Estados</option>
                <option value="Oficial">Actual / Oficial</option>
                <option value="Posible">Posible Proveedor</option>
            </select>
        </div>

        <h3>📋 Directorio General (Agrupado)</h3>
        <div id="contenedorDirectorio">
            <!-- Acordeones dinámicos aquí -->
        </div>
    </div>

    <!-- MODAL 1: NUEVO PROVEEDOR -->
    <div class="modal-overlay" id="modalProv">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🏢 Ficha de Proveedor</h2>
                <div style="font-size: 2em; cursor: pointer; color: #cbd5e1;" id="estrellaFav" onclick="toggleFav()">☆</div>
            </div>
            
            <div class="form-grid">
                <div class="form-group"><label>Nombre</label><input type="text" id="provNombre" placeholder="Ej. Back2Bio"></div>
                <div class="form-group"><label>Contacto</label><input type="tel" id="provContacto" placeholder="+56 9..."></div>
                <div class="form-group"><label>Ciudad</label><input type="text" id="provCiudad" placeholder="Ej. Santiago"></div>
            </div>

            <!-- AUTO-CLASIFICACIÓN -->
            <div style="background: var(--highlight-bg); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--cyan-accent); display: flex; align-items: center; gap: 10px;">
                <strong>Línea del Proveedor (Automática):</strong> 
                <span id="etiquetaLineaProv" class="tag tag-eco">Sin Productos</span>
                <small style="opacity: 0.7;">(Se calcula al agregar productos)</small>
            </div>

            <label>Estado de Proveedor:</label>
            <div class="radio-group">
                <label class="radio-label opt-oficial"><input type="radio" name="catEstado" value="Oficial" checked> Oficial</label>
                <label class="radio-label opt-posible"><input type="radio" name="catEstado" value="Posible"> Posible</label>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
                <h3 style="margin: 0;">📦 Productos a agregar</h3>
                <button class="btn-primary" style="padding: 5px 15px; font-size: 0.9em;" onclick="abrirModalProd()">+ Agregar Prod.</button>
            </div>
            <div id="listaTempProductos" style="margin-top: 10px;"></div>

            <div style="display: flex; gap: 10px; margin-top: 25px; justify-content: flex-end;">
                <button class="btn-secondary" onclick="cerrarModal('modalProv')">Cancelar</button>
                <button class="btn-primary" onclick="guardarProveedor()">Guardar Proveedor</button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: AGREGAR / EDITAR PRODUCTO -->
    <div class="modal-overlay" id="modalProd">
        <div class="modal-content" style="max-width: 500px; border-top-color: var(--cyan-accent);">
            <div class="modal-header">
                <h2 id="tituloModalProd">➕ Detalle del Producto</h2>
            </div>
            
            <label>Línea del Producto:</label>
            <div class="radio-group">
                <label class="radio-label opt-eco"><input type="radio" name="prodLinea" value="Eco" checked> Tradicional / Eco</label>
                <label class="radio-label opt-premium"><input type="radio" name="prodLinea" value="Premium"> Sustentable / Premium</label>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="prodCatSelect" onchange="checkNuevaCategoria('prodCat')">
                        <!-- Opciones Dinámicas -->
                    </select>
                    <input type="text" id="prodCatNueva" placeholder="Escribe nueva categoría..." style="display:none; margin-top:5px; border-color: var(--warning);">
                </div>
                <div class="form-group">
                    <label>Sub-Categoría</label>
                    <select id="prodSubSelect" onchange="checkNuevaCategoria('prodSub')">
                        <!-- Opciones Dinámicas -->
                    </select>
                    <input type="text" id="prodSubNueva" placeholder="Escribe nueva sub-categoría..." style="display:none; margin-top:5px; border-color: var(--warning);">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 10px;">
                <label>Nombre del Producto</label>
                <input type="text" id="prodNombre" placeholder="Ej. Envase PET 500cc">
            </div>
            <div class="form-grid">
                <div class="form-group"><label>P. Minorista ($)</label><input type="number" id="prodMin"></div>
                <div class="form-group"><label>P. Mayorista ($)</label><input type="number" id="prodMay"></div>
            </div>

            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                <button class="btn-secondary" onclick="cerrarModal('modalProd')">Cancelar</button>
                <button class="btn-primary" onclick="guardarProducto()">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script>
        // --- BASE DE DATOS Y ESTADOS ---
        let directorio = []; 
        let productosTemporales = [];
        let esFavActual = false;
        
        // Listas dinámicas para que puedas crear las tuyas
        let categoriasLista = ["Plástico", "Cartón", "Aluminio", "Papelería", "Biodegradable"];
        let subcategoriasLista = ["Bolsas camiseta", "Bolsas transparentes/celofán", "Bolsas taco/prepicadas", "Vasos", "Cajas"];

        // Variables de control para saber si editamos o agregamos, y a quién
        let modoProducto = 'temp'; // 'temp' (nuevo prov), 'add_dir' (prov existente), 'edit_dir'
        let idProvSeleccionado = null;
        let idProdSeleccionado = null;

        // --- INICIALIZACIÓN ---
        function toggleTheme() {
            const body = document.body;
            body.getAttribute('data-theme') === 'dark' ? body.removeAttribute('data-theme') : body.setAttribute('data-theme', 'dark');
        }

        function toggleFav() {
            esFavActual = !esFavActual;
            const estrella = document.getElementById('estrellaFav');
            estrella.innerHTML = esFavActual ? '★' : '☆';
            estrella.style.color = esFavActual ? '#fbbf24' : '#cbd5e1';
            estrella.style.filter = esFavActual ? 'drop-shadow(0 0 8px #fbbf24)' : 'none';
        }

        function cerrarModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- GESTIÓN DE PROVEEDORES (MODAL) ---
        function abrirModalProv() {
            productosTemporales = [];
            esFavActual = false; toggleFav(); toggleFav(); // Reset visual
            document.getElementById('provNombre').value = '';
            document.getElementById('provContacto').value = '';
            document.getElementById('provCiudad').value = '';
            actualizarLineaAutomaticaTemp();
            renderListaTemp();
            document.getElementById('modalProv').style.display = 'flex';
        }

        function guardarProveedor() {
            const nombre = document.getElementById('provNombre').value;
            if(!nombre) { alert("Ingresa el nombre del proveedor."); return; }

            const proveedor = {
                id: 'prov_' + Date.now(),
                nombre: nombre,
                contacto: document.getElementById('provContacto').value || '-',
                ciudad: document.getElementById('provCiudad').value || '-',
                estado: document.querySelector('input[name="catEstado"]:checked').value,
                favorito: esFavActual,
                linea: calcularLinea(productosTemporales), // Automático!
                productos: [...productosTemporales]
            };

            directorio.push(proveedor);
            renderDirectorio();
            cerrarModal('modalProv');
        }

        function eliminarProveedor(idProv) {
            if(confirm("¿Estás seguro de eliminar todo este proveedor y sus productos?")) {
                directorio = directorio.filter(p => p.id !== idProv);
                renderDirectorio();
            }
        }

        // --- GESTIÓN DE PRODUCTOS (MODAL) ---
        function cargarOpcionesSelect() {
            const selCat = document.getElementById('prodCatSelect');
            const selSub = document.getElementById('prodSubSelect');
            
            selCat.innerHTML = categoriasLista.map(c => `<option value="${c}">${c}</option>`).join('') + `<option value="OTRA">➕ Crear Nueva...</option>`;
            selSub.innerHTML = subcategoriasLista.map(s => `<option value="${s}">${s}</option>`).join('') + `<option value="OTRA">➕ Crear Nueva...</option>`;
            
            document.getElementById('prodCatNueva').style.display = 'none';
            document.getElementById('prodSubNueva').style.display = 'none';
        }

        function checkNuevaCategoria(tipo) {
            const select = document.getElementById(tipo + 'Select');
            const input = document.getElementById(tipo + 'Nueva');
            input.style.display = select.value === 'OTRA' ? 'block' : 'none';
            if(select.value === 'OTRA') input.focus();
        }

        function abrirModalProd(modo = 'temp', idProv = null, idProd = null) {
            modoProducto = modo; idProvSeleccionado = idProv; idProdSeleccionado = idProd;
            cargarOpcionesSelect();
            document.getElementById('tituloModalProd').innerText = modo === 'edit_dir' ? '✏️ Editar Producto' : '➕ Detalle del Producto';
            
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodMin').value = '';
            document.getElementById('prodMay').value = '';
            
            if(modo === 'edit_dir') {
                const prov = directorio.find(p => p.id === idProv);
                const prod = prov.productos.find(p => p.id === idProd);
                document.getElementById('prodNombre').value = prod.nombre;
                document.getElementById('prodMin').value = prod.minorista;
                document.getElementById('prodMay').value = prod.mayorista;
                document.querySelector(`input[name="prodLinea"][value="${prod.linea}"]`).checked = true;
                
                if(categoriasLista.includes(prod.categoria)) document.getElementById('prodCatSelect').value = prod.categoria;
                if(subcategoriasLista.includes(prod.subcategoria)) document.getElementById('prodSubSelect').value = prod.subcategoria;
            }
            
            document.getElementById('modalProd').style.display = 'flex';
        }

        function guardarProducto() {
            let cat = document.getElementById('prodCatSelect').value;
            let sub = document.getElementById('prodSubSelect').value;
            
            // Si el usuario creó una nueva, la guardamos en la lista global
            if(cat === 'OTRA') {
                cat = document.getElementById('prodCatNueva').value;
                if(cat && !categoriasLista.includes(cat)) categoriasLista.push(cat);
            }
            if(sub === 'OTRA') {
                sub = document.getElementById('prodSubNueva').value;
                if(sub && !subcategoriasLista.includes(sub)) subcategoriasLista.push(sub);
            }

            const nombre = document.getElementById('prodNombre').value;
            if(!nombre || !cat || !sub) { alert("Completa Nombre, Categoría y Subcategoría"); return; }

            const prodData = {
                nombre: nombre,
                linea: document.querySelector('input[name="prodLinea"]:checked').value,
                categoria: cat, subcategoria: sub,
                minorista: Number(document.getElementById('prodMin').value),
                mayorista: Number(document.getElementById('prodMay').value)
            };

            if(modoProducto === 'temp') {
                prodData.id = 'temp_' + Date.now();
                productosTemporales.push(prodData);
                actualizarLineaAutomaticaTemp();
                renderListaTemp();
            } else if (modoProducto === 'add_dir') {
                prodData.id = 'prod_' + Date.now();
                const prov = directorio.find(p => p.id === idProvSeleccionado);
                prov.productos.push(prodData);
                prov.linea = calcularLinea(prov.productos); // Recalcular línea del proveedor
                renderDirectorio();
            } else if (modoProducto === 'edit_dir') {
                const prov = directorio.find(p => p.id === idProvSeleccionado);
                let prod = prov.productos.find(p => p.id === idProdSeleccionado);
                Object.assign(prod, prodData); // Actualiza los datos
                prov.linea = calcularLinea(prov.productos); // Recalcular
                renderDirectorio();
            }

            cerrarModal('modalProd');
        }

        function eliminarProducto(idProv, idProd) {
            if(confirm("¿Eliminar producto?")) {
                const prov = directorio.find(p => p.id === idProv);
                prov.productos = prov.productos.filter(p => p.id !== idProd);
                prov.linea = calcularLinea(prov.productos);
                renderDirectorio();
            }
        }

        // --- LÓGICA DE LÍNEA AUTOMÁTICA (HÍBRIDO) ---
        function calcularLinea(listaProductos) {
            if(listaProductos.length === 0) return "Sin Productos";
            const tieneEco = listaProductos.some(p => p.linea === 'Eco');
            const tienePremium = listaProductos.some(p => p.linea === 'Premium');
            
            if(tieneEco && tienePremium) return "Híbrido";
            if(tieneEco) return "Eco";
            return "Premium";
        }

        function actualizarLineaAutomaticaTemp() {
            const linea = calcularLinea(productosTemporales);
            const etiqueta = document.getElementById('etiquetaLineaProv');
            etiqueta.innerText = linea;
            etiqueta.className = 'tag ' + (linea==='Eco' ? 'tag-eco' : (linea==='Premium' ? 'tag-premium' : (linea==='Híbrido' ? 'tag-hibrido' : '')));
        }

        function renderListaTemp() {
            const div = document.getElementById('listaTempProductos');
            div.innerHTML = productosTemporales.map(p => `
                <div class="prod-item">
                    <div>
                        <span class="tag ${p.linea==='Eco'?'tag-eco':'tag-premium'}">${p.linea}</span>
                        <strong>${p.nombre}</strong> <small>(${p.categoria} > ${p.subcategoria})</small>
                    </div>
                    <strong>$${p.mayorista}</strong>
                </div>
            `).join('');
        }

        // --- RENDERIZADO DEL DIRECTORIO (ACORDEONES ANIDADOS) ---
        function getClaseTag(linea) {
            if(linea === 'Eco') return 'tag-eco';
            if(linea === 'Premium') return 'tag-premium';
            if(linea === 'Híbrido') return 'tag-hibrido';
            return '';
        }

        function renderDirectorio() {
            const contenedor = document.getElementById('contenedorDirectorio');
            const filtroLinea = document.getElementById('filtroLinea').value;
            const filtroEst = document.getElementById('filtroEst').value;

            // Filtrar y ordenar proveedores
            let provsFiltrados = directorio.filter(prov => {
                let pasaLinea = (filtroLinea === 'todos') || (prov.linea === filtroLinea);
                let pasaEst = (filtroEst === 'todos') || (prov.estado === filtroEst);
                return pasaLinea && pasaEst;
            }).sort((a,b) => (b.favorito?1:0) - (a.favorito?1:0));

            if(provsFiltrados.length === 0) {
                contenedor.innerHTML = '<p>No hay proveedores que coincidan con la búsqueda.</p>'; return;
            }

            let html = '';
            provsFiltrados.forEach(prov => {
                const favIcon = prov.favorito ? '⭐' : '';
                const tagEst = prov.estado === 'Oficial' ? '<span class="tag tag-oficial">Oficial</span>' : '<span class="tag tag-posible">Posible</span>';
                const tagLineaProv = `<span class="tag ${getClaseTag(prov.linea)}">${prov.linea}</span>`;

                html += `
                <details class="accordion">
                    <summary>
                        <div style="display:flex; gap:15px; align-items:center;">
                            <span style="font-size:1.2em;">${favIcon} <strong>${prov.nombre}</strong></span>
                            ${tagLineaProv} ${tagEst}
                            <small>📍 ${prov.ciudad}</small>
                        </div>
                        <div>
                            <button class="btn-primary" style="padding:4px 8px; font-size:0.8em;" onclick="abrirModalProd('add_dir', '${prov.id}')">+ Prod.</button>
                            <button class="btn-danger" onclick="eliminarProveedor('${prov.id}')">Eliminar</button>
                        </div>
                    </summary>
                    <div class="details-content">`;

                // Agrupar productos por Categoría -> Subcategoría
                let agrupado = {};
                prov.productos.forEach(prod => {
                    if(!agrupado[prod.categoria]) agrupado[prod.categoria] = {};
                    if(!agrupado[prod.categoria][prod.subcategoria]) agrupado[prod.categoria][prod.subcategoria] = [];
                    agrupado[prod.categoria][prod.subcategoria].push(prod);
                });

                if(Object.keys(agrupado).length === 0) html += `<small>No hay productos registrados.</small>`;

                for(let cat in agrupado) {
                    html += `<details class="cat-details"><summary>📂 ${cat}</summary><div class="details-content">`;
                    for(let sub in agrupado[cat]) {
                        html += `<details class="subcat-details" open><summary>📁 ${sub}</summary><div class="details-content">`;
                        
                        agrupado[cat][sub].forEach(prod => {
                            html += `
                            <div class="prod-item">
                                <div>
                                    <span class="tag ${getClaseTag(prod.linea)}">${prod.linea}</span>
                                    <span>${prod.nombre}</span>
                                </div>
                                <div style="display:flex; align-items:center; gap:15px;">
                                    <span style="color:#10b981; font-weight:bold;">$${prod.mayorista.toLocaleString('es-CL')} (Mayorista)</span>
                                    <button class="btn-warning" onclick="abrirModalProd('edit_dir', '${prov.id}', '${prod.id}')">Editar</button>
                                    <button class="btn-danger" onclick="eliminarProducto('${prov.id}', '${prod.id}')">X</button>
                                </div>
                            </div>`;
                        });
                        html += `</div></details>`; // Cierra subcat
                    }
                    html += `</div></details>`; // Cierra cat
                }
                html += `</div></details>`; // Cierra proveedor
            });
            contenedor.innerHTML = html;
        }
    </script>
</body>
</html>
